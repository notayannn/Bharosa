<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bharosa — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div id="no-business-card" class="card" style="display:none;">
        <div class="card-header"><h3>Set up your business</h3></div>
        <form id="business-form">
          <input type="text" id="business-name" placeholder="Business name" required />
          <button type="submit">Create business</button>
        </form>
      </div>

      <div id="dashboard-content" style="display:none;">
        <h2 id="business-name-header"></h2>
        <p class="subhead">Overview of your ledger</p>

        <div class="stat-row">
          <div class="stat-card overdue"><div class="value" id="stat-overdue">–</div><div class="label">Overdue invoices</div></div>
          <div class="stat-card pending"><div class="value" id="stat-approvals">–</div><div class="label">Awaiting review</div></div>
          <div class="stat-card neutral"><div class="value" id="stat-total">–</div><div class="label">Total invoices</div></div>
          <div class="stat-card neutral"><div class="value" id="stat-clients">–</div><div class="label">Total clients</div></div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Pending approvals</h3>
          </div>
          <table>
            <thead><tr><th>Agent</th><th>Action</th><th>Confidence</th><th></th></tr></thead>
            <tbody id="approvals-body"><tr class="empty-row"><td colspan="4">Loading…</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Invoices</h3>
            <div class="btn-row">
              <button class="secondary" id="run-reminders-btn">Send reminders now</button>
              <button id="new-invoice-btn">New invoice</button>
            </div>
          </div>
          <table>
            <thead><tr><th>Client</th><th>Amount</th><th>Due</th><th>Status</th></tr></thead>
            <tbody id="invoices-body"><tr class="empty-row"><td colspan="4">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
