<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bharosa — Client</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
            <div class="editable-title" id="client-title-display">
        <h2 id="client-name-header">Loading… <span id="risk-badge"></span></h2>
        <button class="edit-title-btn" id="edit-contact-btn" title="Edit contact info" aria-label="Edit contact info">✎</button>
      </div>
      <p class="subhead" id="client-contact-sub"></p>

      <form class="title-edit-form" id="contact-edit-form" style="display:none; margin-bottom:1.5rem;">
        <input type="text" id="contact-edit-input" placeholder="Email or WhatsApp number" required />
        <button type="submit" class="success">Save</button>
        <button type="button" class="secondary" id="contact-cancel-btn">Cancel</button>
      </form>

      <div class="card">
        <div class="card-header">
          <h3>Invoices</h3>
          <button id="new-invoice-btn">New invoice</button>
        </div>
        <table>
          <thead><tr><th>Amount</th><th>Issued</th><th>Due</th><th>Status</th></tr></thead>
          <tbody id="invoices-body"><tr class="empty-row"><td colspan="4">Loading…</td></tr></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-header"><h3>Disputes</h3></div>
        <div id="disputes-list"><p class="subhead">Loading…</p></div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script type="module" src="/js/client.js"></script>
</body>
</html>
